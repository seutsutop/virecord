name: Build VIrecord

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore
      run: dotnet restore VIrecord.sln -r win-x64
      shell: pwsh

    - name: Build
      run: dotnet build VIrecord.sln -c Debug --no-restore -r win-x64
      shell: pwsh

    - name: Publish main app
      run: dotnet publish VIrecord/VIrecord.csproj -c Debug -r win-x64 --self-contained -o publish
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VIrecord-win-x64
        path: publish/
        if-no-files-found: warn
