name: Build VIrecord

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore VIrecord.sln
      shell: cmd

    - name: Build
      run: msbuild VIrecord.sln /p:Configuration=Debug /p:Platform=x64 /m
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VIrecord-win-x64
        path: VIrecord/bin/
        if-no-files-found: warn
