name: Build VIrecord

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore with RID
      run: dotnet restore VIrecord.sln --runtime win-x64
      shell: cmd

    - name: Build
      run: msbuild VIrecord.sln /p:Configuration=Debug /p:Platform=x64 /m
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VIrecord-win-x64
        path: VIrecord/bin/
        if-no-files-found: warn
