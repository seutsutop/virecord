name: Build VIrecord

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore VIrecord.sln
      shell: cmd

    - name: Build
      run: msbuild VIrecord.sln /p:Configuration=Release /p:Platform="Any CPU" /m
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VIrecord-win-x64
        path: VIrecord/bin/Release/
        if-no-files-found: warn
