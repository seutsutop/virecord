name: Build VIrecord

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore VIrecord.sln
      shell: pwsh

    - name: Build
      run: dotnet build VIrecord.sln -c Release --no-restore
      shell: pwsh

    - name: Publish
      run: dotnet publish src/VIrecord/VIrecord.csproj -c Release -r win-x64 --self-contained -o publish
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VIrecord-win-x64
        path: publish/
        if-no-files-found: error